<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HTiSA Werkgever">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest-werkgever.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>HTiSA – Werkgever</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .logo{width:160px;height:160px;object-fit:contain;margin-bottom:16px;animation:pop .6s cubic-bezier(0.34,1.56,0.64,1) forwards;}
  @keyframes pop{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  h1{font-size:22px;font-weight:800;color:#f59e0b;margin-bottom:6px;text-align:center;}
  p{font-size:14px;color:#5b8fa0;text-align:center;margin-bottom:20px;line-height:1.6;}
  .btn{display:flex;width:100%;max-width:320px;background:#f59e0b;color:white;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:left;text-decoration:none;transition:background .15s;align-items:center;gap:12px;margin-bottom:16px;}
  .btn:hover{background:#d97706;}
  .btn-ico{font-size:24px;}
  .btn-text{flex:1;}
  .btn-label{display:block;font-size:15px;font-weight:700;}
  .btn-sub{display:block;font-size:11px;opacity:0.85;margin-top:2px;}
  .btn-install{display:none;width:100%;max-width:320px;background:#34a853;color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;margin-bottom:10px;font-family:inherit;}
  .btn-install.show{display:block;}
  .install-tip{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:14px;width:100%;max-width:320px;margin-top:4px;}
  .install-tip-titel{font-size:12px;font-weight:800;color:#f59e0b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .install-stap{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#78350f;margin-bottom:6px;line-height:1.5;}
  .install-stap:last-child{margin-bottom:0;}
  #status{font-size:12px;color:#2e7d32;font-weight:600;margin-bottom:8px;text-align:center;}
</style>
</head>
<body>

<img src="icons/icon-512.png" class="logo" alt="HTiSA logo"/>
<h1>HTiSA – Werkgever</h1>
<p>Tik op de knop om aanwezigheden te registreren.</p>

<a href="index.html" class="btn" onclick="setRol('werkgever')">
  <span class="btn-ico">🏭</span>
  <span class="btn-text">
    <span class="btn-label">Open de app</span>
    <span class="btn-sub">Aanwezigheid registreren · PIN vereist</span>
  </span>
</a>

<div id="status"></div>

<button class="btn-install" id="install-btn">📲 Installeer op startscherm</button>

<div class="install-tip">
  <div class="install-tip-titel">📲 Installeer op je startscherm</div>
  <div class="install-stap"><span>🍎</span><span><strong>iPhone:</strong> tik op ⎋ onderaan → "Zet op beginscherm"</span></div>
  <div class="install-stap"><span>🤖</span><span><strong>Android:</strong> tik op ⋮ → "Toevoegen aan startscherm" → "Installeren"</span></div>
</div>

<script>
function setRol(rol){
  localStorage.setItem('htisa_rol', rol);
}

var installPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  installPrompt = e;
  document.getElementById('install-btn').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async function() {
  if(!installPrompt) return;
  installPrompt.prompt();
  var result = await installPrompt.userChoice;
  installPrompt = null;
  document.getElementById('install-btn').classList.remove('show');
  if(result.outcome === 'accepted') {
    document.getElementById('status').textContent = '✅ App geïnstalleerd!';
  }
});
</script>
</body>
</html>
